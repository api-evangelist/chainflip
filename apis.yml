aid: chainflip
name: Chainflip
description: >-
  Chainflip is a decentralised, permissionless cross-chain protocol for native
  asset swaps and cross-chain lending. It lets users and integrators swap and
  borrow against native assets such as BTC, ETH, SOL, USDC, USDT, TRX, and DOT
  across chains without wrapped assets, traditional bridges, or centralised
  custody. The protocol runs as a Proof-of-Stake MPC network of roughly 150
  validators securing a fully on-chain trading system built on an
  application-specific State Chain and a just-in-time (JIT) AMM liquidity
  design. Developers integrate via the typed @chainflip/sdk JavaScript SDK and
  the Broker / State Chain JSON-RPC interfaces to fetch quotes, request deposit
  addresses, encode vault swaps, and route swaps for broker commission.
